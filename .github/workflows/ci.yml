# CI des Module-Repos: Module gegen den gepinnten Core (.core = Submodul auf festem Tag) – Pflicht.
# Zusätzlich gegen den aktuellen Core-Stand (`main`) als Warnung (continue-on-error).
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  CI: 'true'
  APP_SECRET: build-time-placeholder-build-time-placeholder

jobs:
  modules:
    name: Module (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        core: [pinned, main]
    continue-on-error: ${{ matrix.core == 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # Core liegt (privat) in KalypzoSolutions: Token mit Lesezugriff als Secret CORE_REPO_TOKEN hinterlegen
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}
      - name: Core auf main (nur Warnlauf)
        if: matrix.core == 'main'
        run: git -C .core fetch origin main && git -C .core checkout origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .core/.bun-version
      - run: bun run setup
      - run: bun run check:catalog
      - run: bun run check:migrations
      - name: Format, Lint und Modulgrenzen (Biome)
        run: bun run lint
      - name: Typprüfung
        run: bun run check
      - run: bun run test
      - run: bun run build
